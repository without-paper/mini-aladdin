
services:
  postgres:
    image: postgres:17
    container_name: mini-aladdin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mini_aladdin
      POSTGRES_USER: mini_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_user -d mini_aladdin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
