
spring.application.name=mini-aladdin

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_aladdin
spring.datasource.username=mini_user
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# M5.1 - Structured logging
logging.structured.format.console=logstash

# Application logging level
logging.level.com.minialaddin=INFO

# ====================================
# M5.3 - Spring Boot Actuator
# ====================================

management.endpoints.web.exposure.include=health,info,metrics

# Default: hide detailed health information
management.endpoint.health.show-details=never

# Enable database health checks
management.health.db.enabled=true

# Enable JVM and HTTP metrics
management.metrics.enable.jvm=true
management.metrics.enable.http=true